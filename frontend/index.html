<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADA Digital – Connexion</title>
    <script>
        /* ── ANTI-FLASH : doit s'exécuter avant tout rendu ── */
        (function() {
            document.documentElement.classList.add('page-loading');
            var saved = localStorage.getItem('mada-theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (saved === null && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
            document.addEventListener('DOMContentLoaded', function() {
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        document.documentElement.classList.remove('page-loading');
                    });
                });
            });
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<!--
    POINT D'ENTRÉE UNIQUE (mode double-clic / file://)
    Toutes les vues sont préchargées : pas de fetch, pas de rechargement.
    Le shell, la session et les données partagent une seule origine.
-->
<body class="bg-[#F7F8FA] dark:bg-[#111827] text-[#303030] dark:text-[#F9FAFB] antialiased flex" data-page="login" data-no-shell>
    <!-- Dynamic App Shell & Topbar (app.js) -->
    <div id="app-shell"></div>
    <div id="topbar-slot"></div>

    <!-- Main Content Area (contenu piloté par app.js / switchPage) -->
    <div class="flex-1 md:ml-[280px] flex flex-col min-h-screen" id="main-viewport">
        <main class="flex-1 mt-16 p-md md:p-xl max-w-container-max mx-auto w-full" id="spa-main">
            <div id="flash"></div>
        </main>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-[100] space-y-3 w-[340px] max-w-[90vw]"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/templates.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/pages/dashboard.js"></script>
    <script src="assets/js/pages/pointage.js"></script>
    <script src="assets/js/pages/employes.js"></script>
    <script src="assets/js/pages/historique.js"></script>
    <script src="assets/js/pages/parametres.js"></script>
    <script src="assets/js/pages/login.js"></script>
</body>
</html>
