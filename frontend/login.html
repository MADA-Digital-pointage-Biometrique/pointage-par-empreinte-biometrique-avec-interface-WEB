<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Connexion - MADA Digital</title>
    <script>!function(){var e=localStorage.getItem('mada-theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;var isDark=(e==='dark'||(e===null&&d));document.documentElement.classList.toggle('dark',isDark);}();</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-stone-950 text-stone-100 antialiased min-h-screen flex items-center justify-center p-md relative overflow-hidden"
      style="background: radial-gradient(1200px 600px at 50% 0%, rgba(244, 106, 33, 0.25), transparent), linear-gradient(180deg, #1c1917 0%, #0c0a09 100%);">

    <!-- Decorative Animated Glow Elements -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-[#F46A21]/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-[420px] bg-stone-900/85 backdrop-blur-xl border border-stone-800 rounded-3xl shadow-2xl p-xl relative z-10 menu-dropdown-panel">
        <div class="flex flex-col items-center text-center mb-lg">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#F46A21] to-[#F9AE3F] text-white flex items-center justify-center mb-md shadow-lg shadow-orange-500/25">
                <span class="material-symbols-outlined text-[36px]">fingerprint</span>
            </div>
            <h1 class="font-extrabold text-2xl tracking-tight text-white">MADA Digital</h1>
            <p class="text-xs text-stone-400 mt-1">Système Biométrique de Gestion de Présence</p>
        </div>

        <div id="flash"></div>

        <form id="login-form">
            <div class="mb-md">
                <label class="text-xs font-semibold uppercase tracking-wider text-stone-400 mb-1.5 block" for="matricule">Matricule</label>
                <div class="flex items-center bg-stone-800/80 rounded-xl px-md border border-stone-700 focus-within:border-[#F46A21] focus-within:ring-2 focus-within:ring-[#F46A21]/20 transition-all">
                    <span class="material-symbols-outlined text-stone-400 mr-sm text-[18px]">badge</span>
                    <input class="bg-transparent border-none text-sm text-white w-full py-2.5 outline-none placeholder-stone-500 font-mono" id="matricule" name="matricule" placeholder="ex: ADM001" required autofocus>
                </div>
            </div>

            <div class="mb-lg">
                <label class="text-xs font-semibold uppercase tracking-wider text-stone-400 mb-1.5 block" for="password">Mot de passe</label>
                <div class="flex items-center bg-stone-800/80 rounded-xl px-md border border-stone-700 focus-within:border-[#F46A21] focus-within:ring-2 focus-within:ring-[#F46A21]/20 transition-all">
                    <span class="material-symbols-outlined text-stone-400 mr-sm text-[18px]">lock</span>
                    <input class="bg-transparent border-none text-sm text-white w-full py-2.5 outline-none placeholder-stone-500" id="password" name="password" type="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full bg-gradient-to-r from-[#F46A21] to-[#F9AE3F] hover:from-[#E05910] hover:to-[#E89D2E] text-white font-semibold text-xs py-3 px-md rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-98">
                <span class="material-symbols-outlined text-[18px]">login</span>
                Se connecter au système
            </button>
        </form>

        <!-- Quick Demo Profiles Selection -->
        <div class="mt-lg pt-md border-t border-stone-800/80">
            <span class="text-[11px] font-semibold uppercase text-stone-500 block mb-sm text-center">Accès Réservé aux Administrateurs</span>
            <div class="grid grid-cols-2 gap-sm">
                <button type="button" class="bg-stone-800/60 hover:bg-stone-800 border border-stone-700/60 rounded-xl p-2.5 text-left cursor-pointer transition-colors" onclick="fillDemo('ADM001', 'admin123')">
                    <div class="text-xs font-bold text-[#F46A21]">Super Admin</div>
                    <div class="text-[10px] font-mono text-stone-400">ADM001 / admin123</div>
                </button>
                <button type="button" class="bg-stone-800/60 hover:bg-stone-800 border border-stone-700/60 rounded-xl p-2.5 text-left cursor-pointer transition-colors" onclick="fillDemo('ADM002', 'admin123')">
                    <div class="text-xs font-bold text-[#F9AE3F]">Admin RH</div>
                    <div class="text-[10px] font-mono text-stone-400">ADM002 / admin123</div>
                </button>
            </div>
            <p class="text-[11px] text-stone-500 text-center mt-sm">Note: Les employés s'identifient exclusivement par leur empreinte sur la borne biométrique.</p>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        function fillDemo(mat, pwd) {
            document.getElementById('matricule').value = mat;
            document.getElementById('password').value = pwd;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mat = document.getElementById('matricule').value.trim();
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');

            btn.disabled = true;
            btn.textContent = 'Connexion...';

            const res = await api.login(mat, pwd);

            if (res.ok) {
                window.location.href = 'dashboard.html';
            } else {
                flash(res.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">login</span> Se connecter au système';
            }
        });
    </script>
</body>
</html>
